<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự kiện * EduHub Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">EduHub Web</a>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="index.html">Sự kiện</a></li>
                <li><a href="#">Đăng ký</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <h1>Sự kiện sắp diễn ra</h1>

        <form id="search-form" class="search-form">
            <label for="keyword">Tìm sự kiện</label>
            <input type="search" id="keyword" placeholder="Tìm sự kiện">
            <button type="submit">Tìm</button>
        </form>

        <p id="status"></p>

        <div id="event-list" class="event-list">
            <article class="card">
                <img src="img/event.svg" alt="WorShop Git & GitHub cho tân sinh viên">
                <div class="card__body">
                    <h2>
                        <a href="event-detail.html?id=1">Workshop Git & GitHub cho tân sinh viên</a>

                    </h2>

                    <p>
                        <time datetime="2026-09-12T08:00">08:00, 12/09/2026</time>
                    </p>

                    <p>Phòng máy A3.201</p>
                    <p>Còn 12/40 chỗ</p>

                </div>
            </article>


            <article class="card">
                <img src="img/event.svg" alt="Hackathon EduHub 24 giờ">
                <div class="card__body">
                    <h2>
                        <a href="event-detail.html?id=2">Hackathon EduHub 24 giờ</a>

                    </h2>

                    <p>
                        <time datetime="2026-12-19T08:00">08:00, 19/12/2026</time>
                    </p>

                    <p>Phòng máy A3.205</p>
                    <p>
                        <span class="badge--full">Hết chỗ</span>
                    </p>
                

                </div>
            </article>
        </div>

    </main>


    <footer class="site-footer">
        <p>&copy; 2026 EduHub Web</p>
    </footer>


    <script src="js/app.js"></script>
</body>
</html>
